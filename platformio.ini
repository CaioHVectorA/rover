[platformio]
default_envs = esp32s3

; -------------------------------------------------------------------
; AMBIENTE ESP32-S3 (Web Server + Gyroscope Receiver)
; -------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Isola compilacao apenas para os arquivos do ESP32
build_src_filter = -<*> +<esp32/*>

; Configuracoes vitais de memoria (evitam brownout e panic de PSRAM)
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DBOARD_HAS_PSRAM
board_build.partitions = default_8MB.csv
lib_deps = 
    links2004/WebSockets@^2.4.1

; -------------------------------------------------------------------
; AMBIENTE ARDUINO NANO (Servo Driver via SoftwareSerial)
; -------------------------------------------------------------------
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600

; Isola compilacao apenas para os arquivos do Nano
build_src_filter = -<*> +<nano/*>

lib_deps = 
    arduino-libraries/Servo@^1.2.1
