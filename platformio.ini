; ===================================================================================
; ROVER - PlatformIO (um ambiente por firmware). src_dir = src/firmware
;   Compilar/gravar:  pio run -e poc2_nano -t upload      (use --upload-port COMx se houver varias placas)
;   Monitor serial :  pio device monitor -e poc2_nano
; Guia dos POCs: docs/pocs/README.md
; ===================================================================================
[platformio]
src_dir = src/firmware
default_envs = poc3_esp32

; -------------------------------------------------------------------
; Bases comuns
; -------------------------------------------------------------------
[base_esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 57600
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
; Serial = USB nativo (IO19/20): IO43/IO44 ficam EXCLUSIVOS do enlace com o Nano (sem logs poluindo o fio).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -I${PROJECT_SRC_DIR}/comum
; Bibliotecas do proprio core citadas por nome: os headers de comum/ ficam fora da varredura do LDF.
lib_deps =
    links2004/WebSockets@^2.4.1
    WiFi
    WebServer
    ESPmDNS
    Preferences

[base_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags = -I${PROJECT_SRC_DIR}/comum
lib_deps =
    arduino-libraries/Servo@^1.2.1
    SoftwareSerial

; -------------------------------------------------------------------
; POC 1 - Enlace RX/TX com servidor no ESP
; -------------------------------------------------------------------
[env:poc1_esp32]
extends = base_esp32
build_src_filter = -<*> +<pocs/poc1_serial_rxtx/esp32/*>

[env:poc1_nano]
extends = base_nano
build_src_filter = -<*> +<pocs/poc1_serial_rxtx/nano/*>

; -------------------------------------------------------------------
; POC 2 - Pan/Tilt controlado (sem video)         [Nano tambem serve ao POC 4]
; -------------------------------------------------------------------
[env:poc2_esp32]
extends = base_esp32
build_src_filter = -<*> +<pocs/poc2_pantilt_controlado/esp32/*>

[env:poc2_nano]
extends = base_nano
build_src_filter = -<*> +<pocs/poc2_pantilt_controlado/nano/*>

; Variante de melhor desempenho: RX no UART de hardware (sem BC337 e sem SoftwareSerial)
[env:poc2_nano_hw]
extends = base_nano
build_flags = ${base_nano.build_flags} -DLINK_HW
build_src_filter = -<*> +<pocs/poc2_pantilt_controlado/nano/*>

; -------------------------------------------------------------------
; POC 3 - Transmissao de video (camera fria, ESP isolado)
; -------------------------------------------------------------------
[env:poc3_esp32]
extends = base_esp32
build_src_filter = -<*> +<pocs/poc3_transmissao_esp/esp32/*>

; -------------------------------------------------------------------
; POC 4 - Pan/Tilt + transmissao, configuravel, com metricas   (Nano = poc2_nano)
; -------------------------------------------------------------------
[env:poc4_esp32]
extends = base_esp32
build_src_filter = -<*> +<pocs/poc4_pantilt_transmissao/esp32/*>

; -------------------------------------------------------------------
; POC 5 - Teste automatico dos motores (so Nano, sem ESP)
; -------------------------------------------------------------------
[env:poc5_nano]
extends = base_nano
monitor_speed = 115200
upload_speed = 57600
build_src_filter = -<*> +<pocs/poc5_motores_teste/nano/*>

; -------------------------------------------------------------------
; POC 6 - Motores controlados pelo celular via ESP
; -------------------------------------------------------------------
[env:poc6_esp32]
extends = base_esp32
build_src_filter = -<*> +<pocs/poc6_motores_controlado/esp32/*>

[env:poc6_nano]
extends = base_nano
build_src_filter = -<*> +<pocs/poc6_motores_controlado/nano/*>

[env:poc6_nano_hw]
extends = base_nano
build_flags = ${base_nano.build_flags} -DLINK_HW
build_src_filter = -<*> +<pocs/poc6_motores_controlado/nano/*>

; -------------------------------------------------------------------
; Firmware anterior compativel com o app Expo (JSON/WebSocket). Mantido como referencia.
; -------------------------------------------------------------------
[env:gateway_esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 57600
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_flags = -DBOARD_HAS_PSRAM
lib_deps = links2004/WebSockets@^2.4.1
build_src_filter = -<*> +<gateway_app/esp32/*>

[env:gateway_nano]
extends = base_nano
build_src_filter = -<*> +<gateway_app/nano/*>

; -------------------------------------------------------------------
; Producao / Teste Integrado Total: Camera + Motores + Pan/Tilt
; -------------------------------------------------------------------
[env:rover_total_esp32]
extends = base_esp32
build_src_filter = -<*> +<producao/esp32/*>

[env:rover_total_nano]
extends = base_nano
build_flags = ${base_nano.build_flags} -DLINK_HW
build_src_filter = -<*> +<producao/nano/*>

; -------------------------------------------------------------------
; Testes de Bancada Integrados (LED D13, Pan/Tilt, Motores 4WD, Ping, Camera)
; -------------------------------------------------------------------
[env:testes_bancada_esp32]
extends = base_esp32
build_src_filter = -<*> +<testes_bancada/esp32/*>

[env:testes_bancada_nano]
extends = base_nano
build_flags = ${base_nano.build_flags} -DLINK_HW
build_src_filter = -<*> +<testes_bancada/nano/*>

; Pulso direto de motor no Nano, sem serial/software serial/ESP.
[env:nano_motor_direto]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600
build_src_filter = -<*> +<testes_bancada/nano_direto/*>

; Enlace unidirecional validado: IO43 -> BC337 -> Nano D0.
; LED D13 e PWM direto do TB6612, sem camera/servos/SoftwareSerial.
[env:led_motores_d0_esp32]
extends = base_esp32
build_src_filter = -<*> +<testes_bancada/led_motores_d0/esp32/*>

[env:led_motores_d0_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
upload_speed = 57600
build_flags = -I${PROJECT_SRC_DIR}/comum
build_src_filter = -<*> +<testes_bancada/led_motores_d0/nano/*>

[env:rover_d0_esp32]
extends = base_esp32
build_src_filter = -<*> +<testes_bancada/rover_d0/esp32/*>

[env:rover_d0_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
upload_speed = 57600
build_flags = -I${PROJECT_SRC_DIR}/comum
build_src_filter = -<*> +<testes_bancada/rover_d0/nano/*>

